name: Owned public reusable - scoped token read-only
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scope-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Only print API status codes for synthetic owned repos
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, urllib.request, urllib.error
          owner = os.environ["SOURCE_REPO"].split("/")[0]
          current = os.environ["SOURCE_REPO"]
          private = f"{owner}/gh-bounty-lab-b-private"
          headers={"Accept":"application/vnd.github+json","User-Agent":"owned-reusable-boundary-research","Authorization":"Bearer "+os.environ["GH_TOKEN"]}
          def code(repository):
              req=urllib.request.Request("https://api.github.com/repos/"+repository+"/contents/README.md", headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=12) as resp: return resp.status
              except urllib.error.HTTPError as err: return err.code
          own=code(current)
          other=code(private)
          print("Caller repository:", current)
          print("Caller own README HTTP status:", own)
          print("Private lab target README HTTP status:", other)
          if own != 200: raise SystemExit("INVALID CONTROL - own repo unreadable")
          if current.endswith("/gh-bounty-lab-a-public") and other not in (403,404): raise SystemExit("UNEXPECTED - public caller accesses private target")
          if current.endswith("/gh-bounty-lab-b-private") and other != 200: raise SystemExit("INVALID CONTROL - private caller should access own repo")
          print("Expected caller-scoped authorization.")
          PY
