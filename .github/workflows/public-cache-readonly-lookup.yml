name: Public repo cannot look up private cache key
on:
  workflow_dispatch:
permissions:
  contents: read
cache-mode: read
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only lookup of synthetic key in public repository
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: cache-probe/synthetic.txt
          key: owner-cache-repo-boundary-20261115-9c7d41
          lookup-only: 'true'
      - name: Confirm isolation
        env:
          HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          echo "PUBLIC repo lookup cache hit: ${HIT}"
          if [ "${HIT}" = "true" ]; then
            echo "UNEXPECTED: check owner-only cache provenance"
            exit 2
          fi
          echo "PASS: unrelated public repo did not see the private cache"
