name: Owned cross-repository read-only authorization baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check repository isolation without exposing credentials
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_A: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import sys
          import urllib.error
          import urllib.request

          source = os.environ["REPO_A"]
          owner = source.split("/", 1)[0]
          target = owner + "/gh-bounty-lab-b-private"
          token = os.environ["GH_TOKEN"]

          def status(repo, auth):
              url = "https://api.github.com/repos/" + repo + "/contents/README.md"
              headers = {
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "owned-bounty-isolation-baseline",
                  "X-GitHub-Api-Version": "2022-11-28"
              }
              if auth:
                  headers["Authorization"] = "Bearer " + token
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      return response.status
              except urllib.error.HTTPError as error:
                  return error.code

          source_status = status(source, True)
          anon_target = status(target, False)
          scoped_target = status(target, True)
          print("Own public README:", source_status)
          print("Target private README, unauthenticated:", anon_target)
          print("Target private README, unrelated job token:", scoped_target)
          if source_status != 200 or anon_target != 404:
              print("BASELINE_INVALID: check source file and target repository visibility")
              sys.exit(2)
          if scoped_target in (403, 404):
              print("PASS: job token did not access unrelated private repository")
              sys.exit(0)
          print("UNEXPECTED: verify target visibility, role and token scope before any security conclusion")
          sys.exit(1)
          PY
